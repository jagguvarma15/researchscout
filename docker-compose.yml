# Profiles group services into RAM-budgeted subsets for the 8GB dev machine:
#   docker compose --profile core up        # db + api + web + keycloak + redis
#   docker compose --profile events up      # kafka + ingest/embed workers (+ db)
# Run core plus at most one extra profile at a time; `db` has no profile so
# `docker compose up -d db` keeps working on its own.
services:
  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    profiles: ["core"]
    environment:
      RS_DATABASE_URL: postgresql+psycopg://researchscout:researchscout@db:5432/researchscout
      RS_LLM_BASE_URL: ${RS_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      RS_LLM_MODEL: ${RS_LLM_MODEL:-qwen2.5:3b-instruct}
      RS_LLM_API_KEY: ${RS_LLM_API_KEY:-ollama}
      RS_OIDC_ISSUER: http://localhost:8080/realms/researchscout
      RS_OIDC_JWKS_URL: http://keycloak:8080/realms/researchscout/protocol/openid-connect/certs
      RS_REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: researchscout
      POSTGRES_PASSWORD: researchscout
      POSTGRES_DB: researchscout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchscout"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: apps/web
      dockerfile: ../../deploy/docker/web.Dockerfile
    profiles: ["core"]
    environment:
      API_URL: http://api:8000
      SITE_URL: http://localhost:4321
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      OIDC_CLIENT_ID: web-bff
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-dev-secret}
      SESSION_REDIS_URL: redis://redis:6379
    ports:
      - "4321:4321"
    depends_on:
      - redis

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    profiles: ["core"]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Fixed issuer so tokens validate identically from the browser (localhost) and from
      # inside the compose network (keycloak); backchannel requests stay dynamic.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      JAVA_OPTS_APPEND: -Xmx256m
    ports:
      - "8080:8080"
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import:ro

  redis:
    image: redis:8-alpine
    profiles: ["core"]
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.3.1
    profiles: ["events", "airtable"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xmx256m
    ports:
      - "29092:29092"
    volumes:
      - kafkadata:/var/lib/kafka/data

  ingest-worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    profiles: ["events"]
    command: ["scout", "worker", "ingest"]
    environment:
      RS_DATABASE_URL: postgresql+psycopg://researchscout:researchscout@db:5432/researchscout
      RS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started

  embed-worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    profiles: ["events"]
    command: ["scout", "worker", "embed"]
    environment:
      RS_DATABASE_URL: postgresql+psycopg://researchscout:researchscout@db:5432/researchscout
      RS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started

  # Opt-in profile: needs real Airtable credentials in the environment or .env.
  airtable-sync:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    profiles: ["airtable"]
    command: ["scout", "worker", "airtable"]
    environment:
      RS_DATABASE_URL: postgresql+psycopg://researchscout:researchscout@db:5432/researchscout
      RS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RS_AIRTABLE_API_KEY: ${RS_AIRTABLE_API_KEY:-}
      RS_AIRTABLE_BASE_ID: ${RS_AIRTABLE_BASE_ID:-}
      RS_AIRTABLE_SAVED_TABLE: ${RS_AIRTABLE_SAVED_TABLE:-Saved papers}
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  pgdata:
  kafkadata:
