services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: researchscout
      POSTGRES_PASSWORD: researchscout
      POSTGRES_DB: researchscout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchscout"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: apps/web
      dockerfile: ../../deploy/docker/web.Dockerfile
    profiles: ["core"]
    environment:
      API_URL: http://api:8000
    ports:
      - "4321:4321"

volumes:
  pgdata:
