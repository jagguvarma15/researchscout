<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ResearchScout">
  <!--
    The site mark is the navbar brand mark: the lucide radar glyph on the accent tile
    (see .brand-mark in src/layouts/Base.astro). Geometry matches that tile - a 10px
    corner radius and a glyph about 0.6 of the tile - so the tab icon and the header
    read as the same logo. Keep the two in step when the accent palette moves.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop class="tile-from" offset="0" stop-color="#ea580c" />
      <stop class="tile-to" offset="1" stop-color="#9a3412" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="10" fill="url(#tile)" />
  <g
    class="glyph"
    transform="translate(6.4 6.4) scale(0.8)"
    fill="none"
    stroke="#ffffff"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="2.25"
  >
    <path d="M19.07 4.93A10 10 0 0 0 6.99 3.34M4 6h.01M2.29 9.62a10 10 0 1 0 19.02-1.27" />
    <path d="M16.24 7.76a6 6 0 1 0-8.01 8.91M12 18h.01m5.98-6.34a6 6 0 0 1-2.22 5.01" />
    <circle cx="12" cy="12" r="2" />
    <path d="m13.41 10.59l5.66-5.66" />
  </g>
  <style>
    /* Dark browser chrome gets the dark-theme accent, exactly like the navbar tile. */
    @media (prefers-color-scheme: dark) {
      .tile-from { stop-color: #fcd34d; }
      .tile-to { stop-color: #f59e0b; }
      .glyph { stroke: #191713; }
    }
  </style>
</svg>
