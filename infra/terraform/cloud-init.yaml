#cloud-config
# k3s single node + a 4GB swap safety net for the 12GB free tier. Oracle's Ubuntu images
# ship restrictive iptables rules, so 80/443 are opened explicitly and persisted.
#
# Ollama runs as a host systemd service, not a pod: the model weights stay out of image
# pulls and the k8s memory ledger, and the binary survives cluster rebuilds. It binds
# 0.0.0.0:11434 so pods can reach it via the node's private IP (the chart's `ollama`
# Service, see templates/ollama-endpoint.yaml); the OCI security list still only admits
# 22/80/443 from the internet.
package_update: true
packages:
  - curl
  - age

swap:
  filename: /swapfile
  size: 4G
  maxsize: 4G

write_files:
  # In place before the Ollama installer runs, so the service starts with it applied.
  - path: /etc/systemd/system/ollama.service.d/override.conf
    content: |
      [Service]
      Environment="OLLAMA_HOST=0.0.0.0:11434"
      Environment="OLLAMA_KEEP_ALIVE=30m"

runcmd:
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 443 -j ACCEPT
  # Pod traffic to the host's Ollama arrives on INPUT from the k3s pod CIDR; Oracle's
  # default reject rule would drop it, so admit exactly that source and port.
  - iptables -I INPUT 6 -m state --state NEW -p tcp -s 10.42.0.0/16 --dport 11434 -j ACCEPT
  - netfilter-persistent save
  - curl -sfL https://get.k3s.io | sh -
  - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  - curl -fsSLo /usr/local/bin/sops https://github.com/getsops/sops/releases/latest/download/sops-$(uname -s | tr A-Z a-z).arm64 && chmod +x /usr/local/bin/sops
  - sudo -u ubuntu helm plugin install https://github.com/jkroepke/helm-secrets
  - mkdir -p /home/ubuntu/.kube && cp /etc/rancher/k3s/k3s.yaml /home/ubuntu/.kube/config && chown -R ubuntu:ubuntu /home/ubuntu/.kube
  - curl -fsSL https://ollama.com/install.sh | sh
  - ollama pull qwen2.5:3b-instruct
