# Build arm64 images natively, push to GHCR, then helm-deploy over SSH to the k3s VM.
# Gated on the DEPLOY_ENABLED repository variable so the pipeline stays green before the VM
# and secrets (VM_HOST, VM_SSH_KEY, SOPS_AGE_KEY on the VM) exist.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency: deploy

jobs:
  build:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: deploy/docker/api.Dockerfile
            context: .
          - name: web
            dockerfile: deploy/docker/web.Dockerfile
            context: apps/web
          - name: worker
            dockerfile: deploy/docker/worker.Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/researchscout-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/researchscout-${{ matrix.name }}:latest

  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ship the chart to the VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az -e "ssh -i ~/.ssh/id_deploy" deploy/ "ubuntu@$VM_HOST:~/researchscout/deploy/"
      - name: Helm upgrade
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy "ubuntu@$VM_HOST" \
            "helm secrets upgrade --install rs ~/researchscout/deploy/charts/researchscout \
               -f ~/researchscout/deploy/charts/researchscout/values-prod.yaml \
               -f ~/researchscout/deploy/secrets/secrets.prod.yaml \
               --set image.api.tag=${{ github.sha }} \
               --set image.web.tag=${{ github.sha }} \
               --set image.worker.tag=${{ github.sha }} \
               --wait --timeout 10m"
