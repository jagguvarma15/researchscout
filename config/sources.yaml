# Source registry — enabling/disabling a source is config, not code. The scheduler runs every
# source marked enabled for its kind (content sources ingest papers; signal sources attach
# observations to papers already stored).
#
# Every source also carries an `attribution` block: who the data belongs to, the terms it
# arrives under, and what this app takes from it. GET /v1/sources serves it verbatim to the
# /about page, so a new connector cannot ship without saying where its data comes from.
# Nothing else in a source block is ever served: `api_key`, `token` and `mailto` stay here.
sources:
  arxiv:
    enabled: true
    kind: content
    cadence: daily
    attribution:
      name: arXiv
      homepage: https://arxiv.org
      terms: https://info.arxiv.org/help/api/tou.html
      data_license: Metadata CC0 1.0; each paper stays under the license its author chose
      provides: Titles, abstracts, authors, categories, ids and links, plus full text for papers you save or open
    # Exactly the scope rule in researchscout/taxonomy.py, expressed as a query. arXiv's `cat:`
    # matches a paper's whole category list rather than only its primary, so this returns every
    # paper touching computing, statistics or mathematics - including the biology, physics,
    # economics and finance work that cross-lists into them, which is the intersection material
    # this radar wants. Nothing outside the scope is fetched, so nothing has to be discarded.
    # Deep backfills should still run per archive (`scout ingest --category cs.* --resume`).
    #
    # `math-ph` is listed separately because it is a top-level archive rather than a `math.*`
    # subcategory, so `cat:math.*` does not reach it. Most of its papers cross-list to
    # `math.MP` and would arrive anyway; the ones that do not were in scope by the predicate
    # and unreachable by the query, which is the sort of gap that never announces itself.
    categories: [cs.*, stat.*, eess.*, math.*, math-ph]
  semantic_scholar:
    enabled: true
    kind: signal
    cadence: daily
    attribution:
      name: Semantic Scholar
      homepage: https://www.semanticscholar.org
      terms: https://www.semanticscholar.org/product/api/license
      data_license: Governed by the licenses accompanying the data (CC BY-NC or ODC-BY); attribution required
      provides: Citation counts per paper
  hf_trending:
    enabled: true
    kind: signal
    cadence: daily
    attribution:
      name: Hugging Face Papers
      homepage: https://huggingface.co/papers
      terms: https://huggingface.co/terms-of-service
      data_license: Community submissions; each entry stays with the people who posted it
      provides: Daily paper rank and per-paper upvote counts
  hn_discussion:
    # Hacker News via the Algolia search API: keyless. Points feed social_mention, comment
    # counts feed discussion; both attach only to papers already stored.
    enabled: true
    kind: signal
    cadence: daily
    attribution:
      name: Hacker News (Algolia API)
      homepage: https://news.ycombinator.com
      terms: https://hn.algolia.com/api
      data_license: Reader-submitted posts; each stays with the person who wrote it
      provides: Story points and comment counts, plus the public story ids they came from
  bluesky:
    # Off since 2026-08: Bluesky now requires authentication for searchPosts everywhere -
    # api.bsky.app (the workaround after the documented public host started 403ing) answers
    # 403 too. Re-enable only once the connector speaks authenticated search (app password).
    # When it ran: post engagement fed social_mention, reply counts fed discussion; the
    # excluded handles are aggregator bots that would otherwise dominate mention counts.
    enabled: false
    kind: signal
    cadence: daily
    attribution:
      name: Bluesky
      homepage: https://bsky.app
      terms: https://bsky.social/about/support/tos
      data_license: Posts stay with their authors
      provides: Engagement and reply counts only - no handles, no post text
    exclude_accounts:
      - arxiv-daily-bot.bsky.social
      - ai-firehose.column.social
  code_adoption:
    # Off by default: GitHub search is rate-limited without a token. Set GITHUB_TOKEN (or `token`
    # here) and flip this to true to record repository stars as a code-adoption signal.
    enabled: false
    kind: signal
    cadence: daily
    attribution:
      name: GitHub
      homepage: https://github.com
      terms: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
      data_license: Public repository metadata read through the REST API
      provides: Star count of the repository that names a paper
  openalex:
    # The citation fallback lane: the walker (ingest/citations.py) hands OpenAlex only papers
    # whose Semantic Scholar watermark is stale, and breakthrough scoring treats citation as
    # an exclusive type (only the freshest source's series counts) - so having both enabled
    # no longer double-counts. Requires an API key (mandatory upstream since 2026-02): set
    # OPENALEX_API_KEY or `api_key` below; without one the connector skips itself.
    enabled: true
    kind: signal
    cadence: daily
    attribution:
      name: OpenAlex
      homepage: https://openalex.org
      terms: https://developers.openalex.org/
      data_license: CC0 1.0
      provides: Citation counts for papers Semantic Scholar has not covered lately
    # api_key: your-openalex-key
    # mailto: you@example.com
  epoch_ai:
    # The model and benchmark catalogue behind /models and /benchmarks: the notable-models CSV
    # plus the benchmarking hub's archive, which is one file per benchmark. CC BY, no key,
    # refreshed once a day. The licence requires the credit below, which is why it is served.
    enabled: true
    kind: catalog
    cadence: daily
    attribution:
      name: Epoch AI
      homepage: https://epoch.ai
      terms: https://epoch.ai/benchmarks/use-this-data
      data_license: CC BY 4.0 - Epoch AI, "Data on AI Models", published online at epoch.ai
      provides: Notable AI models with organisation, parameters, training compute and licensing, plus every benchmark in the AI Benchmarking Hub and the scores recorded against it
  huggingface_models:
    # Open-weight models by download count, and the arXiv tags on their model cards - which is
    # what links a model to the paper it came from in this corpus.
    enabled: true
    kind: catalog
    cadence: daily
    attribution:
      name: Hugging Face Hub
      homepage: https://huggingface.co
      terms: https://huggingface.co/terms-of-service
      data_license: Public repository metadata; each model stays under the licence its authors chose
      provides: Open-weight model names, task, download and like counts, and the papers their cards cite
  openreview:
    # Off by default: best-effort review scores via the search endpoint (the /notes listing is
    # bot-challenged as of 2026-07); partial and bursty around conference review cycles. Flip
    # on around review season.
    enabled: false
    kind: signal
    cadence: daily
    attribution:
      name: OpenReview
      homepage: https://openreview.net
      terms: https://openreview.net/legal/terms
      data_license: Reviews stay with their venues and reviewers
      provides: Review scores where a venue publishes them
