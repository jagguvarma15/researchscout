# Postgres datasource for the local stack. Copied verbatim into
# .local/grafana/provisioning/datasources/ by make setup. No password: the repo-local
# cluster uses trust auth, so the driver never gets asked for one.
apiVersion: 1

datasources:
  - name: ResearchScout Postgres
    uid: researchscout-pg
    type: postgres
    access: proxy
    url: 127.0.0.1:5432
    user: researchscout
    isDefault: true
    editable: false
    jsonData:
      database: researchscout
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
