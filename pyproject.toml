[project]
name = "researchscout"
version = "0.1.0"
description = "A source-agnostic radar for AI/ML research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "openai>=1.0",
    "selectolax>=0.4.11",
    "bytewax[kafka]>=0.21,<0.22",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt[crypto]>=2.9",
]

[project.scripts]
scout = "researchscout.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6",
    "testcontainers>=4.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt[crypto]>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["researchscout"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "feedparser",
    "alembic",
    "alembic.*",
    "uvicorn",
    "sentence_transformers",
    "sentence_transformers.*",
    "pgvector",
    "pgvector.*",
    "torch",
    "torch.*",
    "sklearn",
    "sklearn.*",
    "confluent_kafka",
    "confluent_kafka.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: needs a real Postgres (run separately; excluded from default unit runs)",
]
