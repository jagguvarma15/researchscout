[project]
name = "researchscout"
version = "0.1.0"
description = "A source-agnostic radar for AI/ML research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    # Named explicitly, though sentence-transformers already pulls it, so the source below can
    # apply: uv only honours [tool.uv.sources] for direct dependencies.
    "torch>=2.12",
    "openai>=1.0",
    "selectolax>=0.4.11",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt[crypto]>=2.9",
]
# The streaming pipeline. Every import of these lives under researchscout/stream/ and the CLI
# makes it lazily, so an install without them runs everything except `scout stream` - which is
# what the deployment does, driving the same work from the scheduler in batches. Keeping them
# out of the default install is the difference between an image that carries a broker client
# it never opens and one that does not.
stream = [
    "bytewax[kafka]>=0.21,<0.22",
]
static-embed = [
    "model2vec>=0.3",
]
# Error reporting and LLM tracing. Both self-gate on their credentials (a Sentry DSN, the
# LANGSMITH_* env contract) and every import is lazy, so an install without them behaves
# exactly like one that has never heard of either service. The deployed image installs
# this extra; a local checkout only needs it to exercise the enabled paths.
observe = [
    "sentry-sdk[fastapi]>=2.0",
    "langsmith>=0.4",
]

[project.scripts]
scout = "researchscout.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6",
    "testcontainers>=4.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt[crypto]>=2.9",
    "model2vec>=0.8.2",
    # Here as well as in the extra: the stream tests import the flow, and a plain `uv sync`
    # is what CI runs.
    "bytewax[kafka]>=0.21,<0.22",
    # Same reasoning for the observe extra: the tests exercise the enabled paths.
    "sentry-sdk[fastapi]>=2.0",
    "langsmith>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["researchscout"]

[tool.ruff]
line-length = 100
# In step with .python-version, the mypy setting below and the image: the project has been
# 3.12 everywhere except here, where it was still telling ruff to write 3.11-compatible code.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "feedparser",
    "alembic",
    "alembic.*",
    "uvicorn",
    "sentence_transformers",
    "sentence_transformers.*",
    "pgvector",
    "pgvector.*",
    "torch",
    "torch.*",
    "sklearn",
    "sklearn.*",
    "confluent_kafka",
    "confluent_kafka.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: needs a real Postgres (run separately; excluded from default unit runs)",
]

# CPU-only torch on Linux. Embedding and reranking run on this machine's CPU (Metal on macOS),
# and the default Linux wheels drag in several gigabytes of CUDA libraries that a container on
# a laptop will never load. The marker keeps macOS resolution on the default index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
