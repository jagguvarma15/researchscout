# Production shape for the single-node k3s VM. Replace example.com with your domain and keep
# real secret values in the SOPS-encrypted deploy/secrets/secrets.prod.yaml, not here.
image:
  pullPolicy: IfNotPresent
  api:
    repository: ghcr.io/jagguvarma15/researchscout-api
  web:
    repository: ghcr.io/jagguvarma15/researchscout-web
  worker:
    repository: ghcr.io/jagguvarma15/researchscout-worker

siteUrl: https://scout.example.com
authUrl: https://auth.example.com

ingress:
  siteHost: scout.example.com
  authHost: auth.example.com
  tls:
    enabled: true
    issuer: letsencrypt

postgres:
  storage: 10Gi

kafka:
  storage: 5Gi

oidc:
  demoUserEnabled: false

otel:
  enabled: true

# Chat is served by the VM's own Ollama (installed by cloud-init as a host systemd
# service), reached through the chart's `ollama` Service.
llm:
  baseUrl: http://ollama:11434/v1
  model: qwen2.5:3b-instruct
  external:
    enabled: true
    # PLACEHOLDER — replace with the VM's private IP on the 10.0.1.0/24 subnet before
    # deploying (`hostname -I | awk '{print $1}'` on the VM, or the OCI console).
    nodeIP: 10.0.1.2

cron:
  ingest:
    enabled: true
  digest:
    enabled: true
