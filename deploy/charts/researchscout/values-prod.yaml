# Production shape: the frontend runs on Vercel; this VM serves the API, Keycloak, and
# everything behind them. Replace the placeholder hosts with your DuckDNS subdomain and
# siteUrl with the Vercel production URL; keep real secret values in the SOPS-encrypted
# deploy/secrets/secrets.prod.yaml, not here.
image:
  pullPolicy: IfNotPresent
  api:
    repository: ghcr.io/jagguvarma15/researchscout-api
  web:
    repository: ghcr.io/jagguvarma15/researchscout-web
  worker:
    repository: ghcr.io/jagguvarma15/researchscout-worker

# Drives the Keycloak realm's redirect URIs — must be the browser-facing site origin.
siteUrl: https://researchscout.vercel.app
authUrl: https://auth.researchscout.duckdns.org

ingress:
  siteHost: scout.researchscout.duckdns.org
  authHost: auth.researchscout.duckdns.org
  apiHost: api.researchscout.duckdns.org
  tls:
    enabled: true
    issuer: letsencrypt

# The web island lives on Vercel; nothing to run in-cluster.
web:
  replicas: 0

postgres:
  storage: 10Gi

kafka:
  storage: 5Gi

oidc:
  demoUserEnabled: false

otel:
  enabled: true

# Chat is served by the VM's own Ollama (installed by cloud-init as a host systemd
# service), reached through the chart's `ollama` Service.
llm:
  baseUrl: http://ollama:11434/v1
  model: qwen2.5:3b-instruct
  external:
    enabled: true
    # PLACEHOLDER — replace with the VM's private IP on the 10.0.1.0/24 subnet before
    # deploying (`hostname -I | awk '{print $1}'` on the VM, or the OCI console).
    nodeIP: 10.0.1.2

cron:
  ingest:
    enabled: true
  digest:
    enabled: true
