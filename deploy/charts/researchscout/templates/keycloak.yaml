apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: {{- include "rs.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        checksum/realm: {{ include (print $.Template.BasePath "/keycloak-realm.yaml") . | sha256sum }}
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.keycloak.adminUser | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: {{ .Values.keycloak.adminPassword | quote }}
            # Pin the issuer to the browser-facing URL; backchannel (in-cluster) requests
            # keep working against the service DNS name.
            - name: KC_HOSTNAME
              value: {{ .Values.authUrl | quote }}
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: JAVA_OPTS_APPEND
              value: {{ .Values.keycloak.javaOpts | quote }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels: {{- include "rs.labels" . | nindent 4 }}
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
