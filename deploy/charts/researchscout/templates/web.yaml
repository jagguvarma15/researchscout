apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {{- include "rs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: API_URL
              value: http://api:8000
            - name: SITE_URL
              value: {{ .Values.siteUrl | quote }}
            - name: KEYCLOAK_PUBLIC_URL
              value: {{ .Values.authUrl | quote }}
            - name: KEYCLOAK_INTERNAL_URL
              value: http://keycloak:8080
            - name: OIDC_CLIENT_ID
              value: web-bff
            - name: OIDC_CLIENT_SECRET
              value: {{ .Values.oidc.clientSecret | quote }}
            - name: SESSION_REDIS_URL
              value: redis://redis:6379
          ports:
            - containerPort: 4321
          readinessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {{- include "rs.labels" . | nindent 4 }}
spec:
  selector:
    app: web
  ports:
    - port: 4321
