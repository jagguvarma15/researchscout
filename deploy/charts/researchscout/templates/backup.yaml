{{- if .Values.backup.enabled }}
# Nightly pg_dump shipped off the box: the init container dumps to a shared volume, the main
# container rclones it to any S3-compatible bucket (OCI Object Storage's S3 endpoint on the
# free tier). Credentials arrive as RCLONE_CONFIG_* env vars from the secrets values.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-postgres
  labels: {{- include "rs.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: dump
              image: {{ .Values.postgres.image }}
              command:
                - sh
                - -c
                - >-
                  pg_dump -Fc
                  "postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.database }}"
                  -f /backup/researchscout-$(date -u +%Y%m%d).dump
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: rclone/rclone:1
              command:
                - sh
                - -c
                - rclone copy /backup "remote:{{ .Values.backup.bucket }}" && rm -f /backup/*
              env:
                - name: RCLONE_CONFIG_REMOTE_TYPE
                  value: s3
                - name: RCLONE_CONFIG_REMOTE_PROVIDER
                  value: {{ .Values.backup.s3.provider | quote }}
                - name: RCLONE_CONFIG_REMOTE_ENDPOINT
                  value: {{ .Values.backup.s3.endpoint | quote }}
                - name: RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID
                  value: {{ .Values.backup.s3.accessKey | quote }}
                - name: RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY
                  value: {{ .Values.backup.s3.secretKey | quote }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              emptyDir: {}
{{- end }}
