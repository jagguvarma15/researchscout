{{- if .Values.cron.ingest.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-ingest
  labels: {{- include "rs.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cron.ingest.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: emit-ingest
              image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - sh
                - -c
                - >-
                  scout jobs emit-ingest
                  --source {{ .Values.cron.ingest.source }}
                  --since $(date -u -d "-{{ .Values.cron.ingest.sinceDays }} day" +%Y-%m-%d)
                  --max {{ .Values.cron.ingest.maxItems }}
              env:
                - name: RS_KAFKA_BOOTSTRAP_SERVERS
                  value: kafka:9092
---
{{- end }}
{{- if .Values.cron.digest.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-digest
  labels: {{- include "rs.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cron.digest.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: digest
              image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["scout", "digest"]
              env:
                - name: RS_DATABASE_URL
                  value: {{ include "rs.dbUrl" . | quote }}
                - name: RS_KAFKA_BOOTSTRAP_SERVERS
                  value: kafka:9092
                - name: RS_LLM_BASE_URL
                  value: {{ .Values.llm.baseUrl | quote }}
                - name: RS_LLM_MODEL
                  value: {{ .Values.llm.model | quote }}
                - name: RS_LLM_API_KEY
                  value: {{ .Values.llm.apiKey | quote }}
{{- end }}
