# The compose realm file, parameterized: redirect URIs and origins follow siteUrl so the same
# chart serves k3d hosts and the real domain.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels: {{- include "rs.labels" . | nindent 4 }}
data:
  realm.json: |
    {
      "realm": "researchscout",
      "enabled": true,
      "registrationAllowed": false,
      "clients": [
        {
          "clientId": "web-bff",
          "name": "ResearchScout web (BFF)",
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": {{ .Values.oidc.clientSecret | quote }},
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": [{{ printf "%s/auth/callback" .Values.siteUrl | quote }}],
          "webOrigins": [{{ .Values.siteUrl | quote }}],
          "attributes": {
            "post.logout.redirect.uris": {{ .Values.siteUrl | quote }}
          },
          "protocolMappers": [
            {
              "name": "api-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "api",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            }
          ]
        },
        {
          "clientId": "api",
          "name": "ResearchScout API (resource server)",
          "protocol": "openid-connect",
          "publicClient": false,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false
        }
      ]{{- if .Values.oidc.demoUserEnabled }},
      "users": [
        {
          "username": "demo",
          "enabled": true,
          "email": "demo@example.com",
          "emailVerified": true,
          "firstName": "Demo",
          "lastName": "User",
          "credentials": [{ "type": "password", "value": "demo", "temporary": false }]
        }
      ]
      {{- end }}
    }
