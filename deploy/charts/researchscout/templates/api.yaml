apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {{- include "rs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RS_DATABASE_URL
              value: {{ include "rs.dbUrl" . | quote }}
            - name: RS_REDIS_URL
              value: redis://redis:6379
            - name: RS_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: RS_OIDC_ISSUER
              value: {{ include "rs.issuer" . | quote }}
            - name: RS_OIDC_JWKS_URL
              value: http://keycloak:8080/realms/researchscout/protocol/openid-connect/certs
            - name: RS_LLM_BASE_URL
              value: {{ .Values.llm.baseUrl | quote }}
            - name: RS_LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: RS_LLM_API_KEY
              value: {{ .Values.llm.apiKey | quote }}
            - name: RS_OTEL_ENABLED
              value: {{ .Values.otel.enabled | quote }}
            - name: RS_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {{- include "rs.labels" . | nindent 4 }}
spec:
  selector:
    app: api
  ports:
    - port: 8000
