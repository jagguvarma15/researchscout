{{- $root := . -}}
{{- range $name, $cfg := .Values.workers }}
{{- if $cfg.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-{{ $name }}
  labels: {{- include "rs.labels" $root | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-{{ $name }}
  template:
    metadata:
      labels:
        app: worker-{{ $name }}
    spec:
      containers:
        - name: worker
          image: "{{ $root.Values.image.worker.repository }}:{{ $root.Values.image.worker.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["scout", "worker", {{ $name | quote }}]
          env:
            - name: RS_DATABASE_URL
              value: {{ include "rs.dbUrl" $root | quote }}
            - name: RS_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: RS_OTEL_ENABLED
              value: {{ $root.Values.otel.enabled | quote }}
            - name: RS_OTLP_ENDPOINT
              value: {{ $root.Values.otel.endpoint | quote }}
            {{- if eq $name "airtable" }}
            - name: RS_AIRTABLE_API_KEY
              value: {{ $cfg.apiKey | quote }}
            - name: RS_AIRTABLE_BASE_ID
              value: {{ $cfg.baseId | quote }}
            {{- end }}
---
{{- end }}
{{- end }}
