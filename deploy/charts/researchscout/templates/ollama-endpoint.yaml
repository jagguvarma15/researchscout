{{- /*
Surface an off-cluster Ollama as an in-cluster Service named `ollama`, so pods talk to
http://ollama:11434/v1 and never learn where the model actually runs. Swapping to an
in-cluster Ollama Deployment later means replacing this file, not touching app config.

Two shapes, picked by what llm.external.nodeIP holds:
  - an IP (prod: the VM's private IP)  -> selectorless Service + manual Endpoints
  - a hostname (k3d: host.k3d.internal) -> ExternalName Service (Endpoints require IPs)
*/}}
{{- if .Values.llm.external.enabled }}
{{- if regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$" .Values.llm.external.nodeIP }}
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels: {{- include "rs.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.llm.external.port }}
      targetPort: {{ .Values.llm.external.port }}
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  labels: {{- include "rs.labels" . | nindent 4 }}
subsets:
  - addresses:
      - ip: {{ .Values.llm.external.nodeIP }}
    ports:
      - port: {{ .Values.llm.external.port }}
{{- else }}
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels: {{- include "rs.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ .Values.llm.external.nodeIP }}
{{- end }}
{{- end }}
