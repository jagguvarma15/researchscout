# k3d overrides: locally built images, one replica of everything, embed worker off to spare
# RAM on the 8GB dev machine (chat still works; indexing runs via `scout index` when needed).
image:
  pullPolicy: Never
  api:
    repository: researchscout/api
    tag: local
  web:
    repository: researchscout/web
    tag: local
  worker:
    repository: researchscout/worker
    tag: local

postgres:
  storage: 1Gi

kafka:
  storage: 1Gi

workers:
  embed:
    enabled: false

# Same wiring as prod, through the chart's `ollama` Service: a hostname in nodeIP renders
# an ExternalName Service, and host.k3d.internal resolves to the machine running Docker —
# where the brew Ollama listens. The FQDN (not plain `ollama`) matters here: the host
# Ollama binds loopback, which arms its DNS-rebinding Host check, and only hostnames
# ending in .localhost/.local/.internal pass it. Prod binds 0.0.0.0 (no check) and keeps
# the short name.
llm:
  baseUrl: http://ollama.default.svc.cluster.local:11434/v1
  external:
    enabled: true
    nodeIP: host.k3d.internal

# Prod parity for the k3d rehearsal. Without the observability stack installed
# (LOCAL=1 bash deploy/scripts/bootstrap.sh) the exporters only log warnings.
otel:
  enabled: true
