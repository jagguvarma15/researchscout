# Disposable local cluster: host port 8080 -> the cluster's traefik ingress (port 80).
# Hosts scout.localtest.me / auth.localtest.me resolve to 127.0.0.1 by public DNS.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: rs
servers: 1
agents: 0
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
