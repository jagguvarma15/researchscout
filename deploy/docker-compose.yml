# The deployed backend: what serves the public site from this machine.
#
# Deliberately separate from the development stack, which runs as host processes under the
# Makefile (`make start`) against the repo-local Postgres in .local/pgdata. This one owns its
# own database volume, so the two never share state and neither can surprise the other.
#
#   make deploy-up        postgres, migrations, api, scheduler
#   make deploy-up-stream  the same plus kafka and the streaming worker
#
# What is deliberately NOT in here:
#   - Ollama, which stays on the host: Docker on macOS has no Metal passthrough, so a
#     containerised model would run on CPU at a fraction of the speed. The API reaches it at
#     host.docker.internal.
#   - The web app, which is deployed to Vercel.
#   - The tunnel. Tailscale runs on the host rather than in a container: one command
#     (`tailscale funnel --bg 8001`), no auth key to store, no userspace networking to debug,
#     and it keeps working across `make deploy-down`. See deploy/PUBLISHING.md.
#   - Kafka and the stream worker by default. They are a profile because on 8 GB the broker is
#     the first thing worth giving up - and because the scheduler can do the same work in
#     batches when RS_SCHEDULER_BATCH_PIPELINE is set, which is how this deployment runs.
#     Never both: two processes fetching from the same upstreams on one address is what
#     arXiv's three-second floor cannot survive.

name: researchscout

# The environment is anchored separately from the service so a service needing one extra
# variable can merge this map instead of replacing it. A sibling `environment:` key overrides
# the anchor's outright rather than deep-merging, which is how the stream worker silently ran
# without every setting the rest of the stack has.
x-backend-env: &backend-env
  # Inside the network the database is a service name, not localhost - this must not be
  # inherited from the host .env.
  RS_DATABASE_URL: postgresql+psycopg://researchscout:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/researchscout
  # Same reason: the host's Ollama, seen from inside a container.
  RS_LLM_BASE_URL: ${RS_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
  RS_LLM_MODEL: ${RS_LLM_MODEL:-qwen2.5:3b-instruct}
  RS_LLM_API_KEY: ${RS_LLM_API_KEY:-ollama}
  RS_SERVICE_TOKEN: ${RS_SERVICE_TOKEN:-}
  # These four default to what a deployment actually wants rather than to what a local
  # checkout wants, because getting them from deploy/.env is exactly what failed: a file
  # written before these settings existed kept the compose fallbacks, the batch pipeline
  # stayed off, and the stack ran for weeks without fetching a paper. deploy/.env now only
  # has to override, and an old one is right by default.
  RS_SCHEDULER_BATCH_PIPELINE: ${RS_SCHEDULER_BATCH_PIPELINE:-true}
  # arXiv submits nothing over a weekend, so two days reaches back only to Saturday on a
  # Monday. Four covers that and a weekend outage.
  RS_SCHEDULER_INGEST_WINDOW_DAYS: ${RS_SCHEDULER_INGEST_WINDOW_DAYS:-4}
  # Walk out of the window after two pages of nothing-new instead of re-fetching all of it.
  # arXiv pages newest-first, so this is sound - and it is what keeps four runs a day inside
  # the request budget arXiv tolerates from one address.
  RS_SCHEDULER_INGEST_EARLY_STOP_PAGES: ${RS_SCHEDULER_INGEST_EARLY_STOP_PAGES:-2}
  # Wall-clock schedule: the fetch-and-enrich tasks run at each of these times and the
  # once-a-day products at the daily one. The 20:30 slot is the one that matters most:
  # arXiv announces the day's papers at 20:00 ET, so without it the evening always shows
  # yesterday. The report runs after that fetch so it describes the day's actual
  # announcement. Set any to an empty string to go back to intervals (report: to the daily
  # set). The zone is named rather than an offset so the runs stay put across daylight
  # saving; the image has tzdata, so nothing else is needed.
  RS_SCHEDULER_PIPELINE_AT: "${RS_SCHEDULER_PIPELINE_AT-05:00,10:00,14:00,17:00,20:30}"
  RS_SCHEDULER_DAILY_AT: "${RS_SCHEDULER_DAILY_AT-17:00}"
  RS_SCHEDULER_REPORT_AT: "${RS_SCHEDULER_REPORT_AT-21:00}"
  RS_SCHEDULER_TIMEZONE: ${RS_SCHEDULER_TIMEZONE:-America/New_York}
  RS_OIDC_ISSUER: ${RS_OIDC_ISSUER:-}
  RS_OIDC_AUDIENCE: ${RS_OIDC_AUDIENCE:-api}
  RS_TERMS_VERSION: ${RS_TERMS_VERSION:-2026-08-01}
  RS_AUTH0_DOMAIN: ${RS_AUTH0_DOMAIN:-}
  RS_AUTH0_MGMT_CLIENT_ID: ${RS_AUTH0_MGMT_CLIENT_ID:-}
  RS_AUTH0_MGMT_CLIENT_SECRET: ${RS_AUTH0_MGMT_CLIENT_SECRET:-}
  RS_RERANK_ENABLED: ${RS_RERANK_ENABLED:-true}
  RS_ASK_FAST_RERANK: ${RS_ASK_FAST_RERANK:-false}
  RS_CHUNK_RETRIEVAL: ${RS_CHUNK_RETRIEVAL:-true}
  RS_CLUSTER_ALGO: ${RS_CLUSTER_ALGO:-hdbscan}
  RS_CHAT_RATE_LIMIT: ${RS_CHAT_RATE_LIMIT:-20}
  RS_CHAT_RATE_LIMIT_ANONYMOUS: ${RS_CHAT_RATE_LIMIT_ANONYMOUS:-5}
  RS_LLM_MAX_CONCURRENCY: ${RS_LLM_MAX_CONCURRENCY:-2}
  S2_API_KEY: ${S2_API_KEY:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}

x-backend: &backend
  build:
    context: ..
    dockerfile: docker/api.Dockerfile
  image: researchscout-backend:latest
  restart: unless-stopped
  environment: *backend-env
  volumes:
    # Model weights are downloaded once and kept; without this every restart refetches them.
    - models:/home/scout/.cache/huggingface
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: researchscout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: researchscout
    ports:
      # Loopback only, and not 5432: the development cluster owns that port. This is here for
      # psql and for restores, not for anything outside the machine.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchscout"]
      interval: 5s
      timeout: 3s
      retries: 10
    # A public site's database gets more than the container default.
    shm_size: 256mb

  # Runs to completion before the API starts, so a deploy never serves against a schema it
  # does not match.
  migrate:
    <<: *backend
    restart: "no"
    command: ["scout", "db", "upgrade"]

  api:
    <<: *backend
    command: ["scout", "serve", "api", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 30s
      timeout: 5s
      # The first start loads the embedder and the cross-encoder, which takes a while on a cold
      # cache; do not let the healthcheck kill it before the models are down.
      start_period: 300s
      retries: 3

  # Digests, topics and the daily report on their intervals - plus ingest, embedding, full
  # text and signals when RS_SCHEDULER_BATCH_PIPELINE is on, which is what keeps a
  # stream-less deployment supplied with new papers.
  scheduler:
    <<: *backend
    command: ["scout", "serve", "scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Lets Grafana Cloud query this Postgres over an outbound tunnel, so the dashboards work
  # without the database being reachable from anywhere else. The agent takes flags rather than
  # environment variables - it ignores the environment entirely, so passing them that way
  # produces an agent that starts, connects to nothing, and says little about why.
  #
  # The three values are plain substitutions rather than required ones: compose interpolates
  # the whole file whatever profile you asked for, so demanding them here would break
  # `make deploy-up` for anyone not using Grafana Cloud.
  pdc-agent:
    # Pinned: this one reaches the database, and a floating tag means the version doing that
    # can change under a restart with nothing in the repository recording which one it is.
    image: grafana/pdc-agent:0.0.63
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - "-token"
      - "${GCLOUD_PDC_SIGNING_TOKEN:-}"
      - "-cluster"
      - "${GCLOUD_PDC_CLUSTER:-}"
      - "-gcloud-hosted-grafana-id"
      - "${GCLOUD_HOSTED_GRAFANA_ID:-}"
    depends_on:
      postgres:
        condition: service_healthy

  # The streaming pipeline, opt-in. Kafka plus the worker is roughly a gigabyte that the
  # scheduler path does not need.
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    profiles: ["stream"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    volumes:
      - kafkadata:/var/lib/kafka/data

  stream:
    <<: *backend
    command: ["scout", "stream", "serve"]
    profiles: ["stream"]
    # Its own build and tag: bytewax and the kafka client are an optional extra, so the image
    # the API and scheduler run from does not carry them. This one asks for them by name.
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      args:
        EXTRAS: stream
    image: researchscout-backend-stream:latest
    environment:
      # Merged, not replaced: everything the rest of the stack is configured with, plus the
      # broker address. Listing only the extras here used to drop the other twenty-odd.
      <<: *backend-env
      RS_KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started

# Named explicitly. Compose would otherwise derive them from the project name and reuse the
# volumes left behind by the Docker stack this repository had before the teardown - which is a
# Postgres 16 data directory, and produces a container that restarts forever complaining about
# an incompatible version. These names collide with nothing.
volumes:
  pgdata:
    name: researchscout-deploy-pgdata
  models:
    name: researchscout-deploy-models
  kafkadata:
    name: researchscout-deploy-kafka
